<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Team</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <video autoplay muted loop id="bgVideo" class="background-video">
        <source src="assets/video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="vignette"></div>

    <button id="videoToggle" class="video-control-btn glass-card" title="Toggle Background Video">
        <i data-lucide="pause"></i>
    </button>

    <div class="login-container">
        <div class="glass-card">
            <div class="profile-section">
                <div class="profile-ring" id="profileRing">
                    <div class="profile-inner" id="profileInner">
                        <img id="profileImage" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666666'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Profile">
                    </div>
                </div>
            </div>

            <div class="input-section">
                <h1>Welcome Back</h1>
                <p class="subtitle">Enter your details to access your account</p>
                
                <div class="input-group">
                    <i data-lucide="user" class="input-icon"></i>
                    <input type="text" id="username" placeholder="Username" autocomplete="off">
                    <label for="username">Username</label>
                    <div class="input-hint-floating">
                        <i data-lucide="info"></i>
                        <span>Tip: Use GitHub username for your profile, or any name for Guest mode!</span>
                    </div>
                </div>

                <button id="loginBtn" class="login-btn">
                    <span class="btn-text">Access Dashboard</span>
                    <i data-lucide="arrow-right" class="btn-icon"></i>
                    <div class="loader" id="btnLoader"></div>
                </button>

                <div class="footer-details">
                    <div class="credit">
                        <span class="made-by">made by</span>
                        <span class="author">Devika Vinod</span>
                    </div>
                    <div class="status-indicator">
                        <span class="dot"></span>
                        <span class="status-text">Systems Active</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="script.js"></script>
    <script>
        // Initialize icons
        lucide.createIcons();
    </script>
</body>
</html>
